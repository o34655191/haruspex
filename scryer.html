<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scryer &mdash; Battle Autopsy Archive</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">&larr; Programs</a>
      <h1>Scryer</h1>
      <span class="sub">Project Haruspex &middot; Battle Autopsy Archive</span>
      <span class="count" id="count"></span>
    </div>

    <ul class="archive" id="archive"></ul>
  </main>

  <!-- =====================================================================
       REPORT INDEX
       Add one entry per report you drop into reports/. Newest first.
         title : shown big
         date  : YYYY-MM-DD (shown in meta)
         file  : path relative to this page, e.g. reports/xxxx.html
         note  : short tag, e.g. "5v5 · 42s"  (optional)
       No build step, no server needed — just edit this array and re-upload.
       ==================================================================== -->
  <script>
    const REPORTS = [
      { title: "Aya",
        date:  "2026-08-25",
        file:  "reports/aya.html",
        note:  "PvP · 4+1 vs 4+1" },
        { title: "Silly Marco",
        date:  "2026-08-25",
        file:  "reports/silly_marco.html",
        note:  "PvP · missiles vs missiles" },
      { title: "Battle Autopsy Report",
        date:  "2026-08-10",
        file:  "reports/20260810T184238Z_1317267546000500.html",
        note:  "PvP · 65.07s" },
      { title: "Battle Autopsy Report",
        date:  "2026-08-08",
        file:  "reports/20260808T182410Z_1358412745000499.html",
        note:  "PvP · 31.86s" },
      { title: "Battle Autopsy Report",
        date:  "2026-08-08",
        file:  "reports/20260808T182252Z_1568649411000499.html",
        note:  "PvP · 18.90s" },
      { title: "Battle Autopsy Report",
        date:  "2026-08-07",
        file:  "reports/20260807T061115Z_1201306423000499.html",
        note:  "PvP · 172.46s" },
      { title: "Battle Autopsy Report",
        date:  "2026-08-04",
        file:  "reports/20260804T181228Z_1324152922000499.html",
        note:  "PvP · 11.83s" },
      { title: "Battle Autopsy Report",
        date:  "2026-08-04",
        file:  "reports/20260804T181154Z_1149137769000505.html",
        note:  "PvP · 167.83s" },
    ];

    const archive = document.getElementById("archive");
    const countEl = document.getElementById("count");
    countEl.textContent = REPORTS.length + (REPORTS.length === 1 ? " report" : " reports");

    if (!REPORTS.length) {
      archive.innerHTML =
        '<li class="empty">No reports yet. Drop a generated .html into ' +
        '<code>reports/</code> and add it to the list above.</li>';
    } else {
      const pad = n => String(n).padStart(3, "0");
      REPORTS.forEach((r, i) => {
        const a = document.createElement("a");
        a.className = "report";
        a.href = r.file;                       // relative link to the report
        a.innerHTML =
          '<span class="idx">' + pad(REPORTS.length - i) + '</span>' +
          '<span class="body"><span class="title"></span>' +
            '<span class="meta"></span></span>' +
          '<span class="open">Open &rarr;</span>';
        // textContent (not innerHTML) so titles/notes can't inject markup
        a.querySelector(".title").textContent = r.title;
        a.querySelector(".meta").textContent =
          [r.date, r.note].filter(Boolean).join("   ·   ");
        const li = document.createElement("li");
        li.appendChild(a);
        archive.appendChild(li);
      });
    }
  </script>
</body>
</html>
