<meta charset="utf-8">
<style>
  :root{
    color-scheme: dark;
    --bg:#0b0e13; --arena-1:#12161d; --arena-2:#1a1710; --panel:#141a23;
    --panel-2:#1b2330; --line:#28323f; --line-soft:#1e2732;
    --ink:#e8eef5; --ink-dim:#9db0c2; --ink-faint:#5f7285;
    --mine:#43c6f0; --mine-soft:#93e2fb; --mine-bg:#0f2b39;
    --enemy:#ff5d5d; --enemy-soft:#ff9d9d; --enemy-bg:#341215;
    --gold:#ffd166; --support:#c8b273;
    --mono: ui-monospace,"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
    --sans: system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0}
  .app{
    font-family:var(--sans); color:var(--ink); background:var(--bg);
    min-height:100vh; padding:18px clamp(12px,3vw,28px) 34px;
    max-width:1180px; margin:0 auto;
    display:flex; flex-direction:column; gap:16px;
  }

  /* ---- header ---- */
  .hud{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px}
  .hud h1{
    font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    margin:0; color:var(--ink);
  }
  .hud .sub{font-family:var(--mono); font-size:12px; color:var(--ink-faint)}
  .hud .legend{margin-left:auto; display:flex; gap:14px; font-size:12px; color:var(--ink-dim)}
  .hud .legend b{font-weight:600}
  .swatch{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle}
  .swatch.mine{background:var(--mine)} .swatch.enemy{background:var(--enemy)} .swatch.crit{background:var(--gold)}

  /* ---- stage: arena + log ---- */
  .stage{display:grid; grid-template-columns:minmax(0,460px) minmax(240px,1fr); gap:16px; align-items:start}
  @media (max-width:840px){ .stage{grid-template-columns:minmax(0,460px); justify-content:center; justify-items:center} }

  .arena{
    position:relative; width:100%; max-width:460px; aspect-ratio:46/72;
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    background:
      radial-gradient(120% 55% at 50% 50%, rgba(120,96,52,.16), transparent 60%),
      linear-gradient(180deg, var(--arena-1) 0%, #14100a 50%, var(--arena-1) 100%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.6), 0 10px 40px rgba(0,0,0,.35);
  }
  /* faint HUD grid + no-man's-land midline */
  .arena::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);
    background-size:44px 44px; mask-image:radial-gradient(120% 80% at 50% 50%,#000,transparent 78%);
  }
  .midline{position:absolute; left:0; right:0; top:50%; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); pointer-events:none}
  .zone-tag{position:absolute; left:8px; font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--ink-faint); pointer-events:none}
  .zone-tag.top{top:6px} .zone-tag.bot{bottom:6px}

  #fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}

  .unit{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    width:80px; padding:6px 4px 5px; border-radius:9px;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.18));
    border:1px solid var(--line); text-align:center; z-index:2;
    transition:box-shadow .12s ease, border-color .12s ease, transform .12s ease;
  }
  .unit .nm{font-size:11px; font-weight:600; line-height:1.05; letter-spacing:.01em}
  .unit .tag{font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase}
  .unit .slot{position:absolute; top:-7px; right:-7px; font-family:var(--mono); font-size:9px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:0 4px; color:var(--ink-dim)}
  .unit.mine{border-color:rgba(67,198,240,.55); box-shadow:0 0 0 1px rgba(67,198,240,.08)}
  .unit.mine .nm{color:var(--mine-soft)}
  .unit.enemy{border-color:rgba(255,93,93,.5); box-shadow:0 0 0 1px rgba(255,93,93,.08)}
  .unit.enemy .nm{color:var(--enemy-soft)}
  .unit.overlord{width:92px}
  .unit.overlord .nm{color:var(--gold)}
  .unit.drone{width:60px; opacity:.72; padding:4px 3px}
  .unit.drone .nm{font-size:10px}
  .unit.dead{opacity:.28; filter:grayscale(1)}
  .unit.hit-mine{box-shadow:0 0 16px 2px rgba(67,198,240,.55); border-color:var(--mine)}
  .unit.hit-enemy{box-shadow:0 0 16px 2px rgba(255,93,93,.55); border-color:var(--enemy)}
  /* timed attack buff live on this unit: a steady gold ring (distinct from the
     transient hit flash, which overrides it briefly on impact) */
  .unit.boosted{box-shadow:0 0 12px 1px rgba(255,209,102,.6); border-color:var(--gold)}
  /* crowd-control (overwhelm / stun): the victim's card is dimmed + tinted while
     disabled, reinforcing the canvas ring drawn above it (see drawControls). Stun
     = violet, overwhelm = orange; both desaturate the card so a disabled unit reads
     as "out of the fight" at a glance. Placed after .boosted so it wins on a unit
     that is both. The transient hit-flash still overrides on impact. */
  .unit.cc-stun{border-color:#b79bff; box-shadow:0 0 13px 1px rgba(163,138,255,.6); filter:saturate(.7)}
  .unit.cc-overwhelm{border-color:#ff8a4d; box-shadow:0 0 13px 1px rgba(255,122,61,.6); filter:saturate(.7)}
  /* shield (Lucius auto/tactics + drone chip): a cyan overhealth bar above the
     card -- value label + a fill that drains with damage. Shown only while the
     unit currently holds shield (.has-shield, toggled per playhead frame). */
  .unit .shield{position:absolute; bottom:calc(100% + 2px); left:0; width:100%;
    display:none; flex-direction:column; gap:1px; pointer-events:none; z-index:3}
  .unit.has-shield .shield{display:flex}
  .unit .shield .lbl{align-self:flex-start; padding-left:2px; font-family:var(--mono);
    font-size:8.5px; line-height:1; color:#c7ecfb; text-shadow:0 1px 2px rgba(0,0,0,.85)}
  .unit .shield .bar{height:5px; border-radius:3px; overflow:hidden;
    background:rgba(67,198,240,.12); border:1px solid rgba(67,198,240,.45)}
  .unit .shield .fill{height:100%; width:0; background:#43c6f0;
    box-shadow:0 0 6px rgba(67,198,240,.75); transition:width .1s linear}
  /* HP bar: the PRIMARY health track, directly above the card, shown for every unit
     with a known max HP (heroes; drones/overlord/ghost carry no 50014 so get none).
     The fill drains with the joint shield+HP sim and shifts green -> amber -> red as
     HP falls; at 0 the card greys out via .dead. Shield (overhealth) sits just above
     this bar. */
  .unit .hpbar{position:absolute; top:calc(100% + 3px); left:0; width:100%; height:5px;
    border-radius:3px; overflow:hidden; background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.16); pointer-events:none; z-index:3; display:none}
  .unit.has-hp .hpbar{display:block}
  .unit .hpbar .hpfill{height:100%; width:100%; background:#5ad19a;
    transition:width .12s linear, background .2s}
  /* Current HP (exact, comma-grouped), centred just below the HP bar; max is not
     shown here -- it's readable from the stats panel. Driven per frame by updateHp. */
  .unit .hpnum{position:absolute; top:calc(100% + 10px); left:50%; transform:translateX(-50%);
    display:none; white-space:nowrap; font-family:var(--mono); font-size:8px; line-height:1;
    color:var(--ink-dim); text-shadow:0 1px 2px rgba(0,0,0,.9); pointer-events:none; z-index:3}
  .unit.has-hp .hpnum{display:block}
  /* mitigation stacks (Murphy's passives + the shared 500640 marker): up to 3
     violet pips just below the card. Each stack blocks the next incoming auto-attack
     and is consumed by it; shown only while the unit currently holds >=1
     (.has-mit, toggled per playhead frame). Below the card so it never collides
     with the shield bar above. */
  .unit .mitpips{position:absolute; top:calc(100% + 36px); left:0; width:100%;
    display:none; justify-content:center; gap:3px; pointer-events:none; z-index:3}
  .unit.has-mit .mitpips{display:flex}
  .unit .mitpips .pip{width:7px; height:7px; border-radius:2px;
    background:rgba(163,138,255,.14); border:1px solid rgba(163,138,255,.5);
    transition:background .1s, box-shadow .1s, border-color .1s}
  .unit .mitpips .pip.on{background:#a38aff; border-color:#a38aff;
    box-shadow:0 0 5px rgba(163,138,255,.85)}
  /* DoT stacks (missile-hero damage-over-time): one compact count badge per active
     DoT type just below the card, coloured by type -- Swift's burn (orange), Fiona's
     radiation (green), Tesla's inductive current (violet/energy). Each badge shows
     the live stack count and is toggled .on per playhead frame; mit pips sit below
     them. The whole row hides when the unit currently carries no DoT. */
  .unit .dots{position:absolute; top:calc(100% + 20px); left:0; width:100%;
    display:flex; justify-content:center; gap:3px; pointer-events:none; z-index:3}
  .unit .dotbadge{display:none; align-items:center; gap:2px; font-family:var(--mono);
    font-size:9px; line-height:1; padding:1px 4px 1px 3px; border-radius:8px;
    border:1px solid; background:rgba(0,0,0,.42); text-shadow:0 1px 2px rgba(0,0,0,.85);
    transition:box-shadow .1s}
  .unit .dotbadge.on{display:inline-flex}
  .unit .dotbadge .ic{font-size:8.5px; line-height:1}
  .unit .dotbadge .n{font-weight:700; font-variant-numeric:tabular-nums}
  .unit .dotbadge.burn{color:#ffb894; border-color:#ff8a3d; box-shadow:0 0 5px rgba(255,138,61,.45)}
  .unit .dotbadge.radiation{color:#bdeeb0; border-color:#5ad19a; box-shadow:0 0 5px rgba(90,209,154,.45)}
  .unit .dotbadge.inductive{color:#cdbcff; border-color:#8f7bff; box-shadow:0 0 5px rgba(143,123,255,.5)}

  /* ---- combat log ---- */
  .log{
    width:100%; align-self:stretch; min-height:0;
    border:1px solid var(--line); border-radius:14px; background:var(--panel);
    display:flex; flex-direction:column; overflow:hidden;
    max-height:min(72vh,620px);
  }
  @media (max-width:840px){ .log{max-height:300px; max-width:460px} }
  .log-head{
    padding:10px 14px; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-dim); border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between}
  .log-head .count{font-family:var(--mono); color:var(--ink-faint)}
  #logList{list-style:none; margin:0; padding:6px 6px 10px; overflow-y:auto; flex:1; scroll-behavior:smooth}
  #logList li{
    display:grid; grid-template-columns:46px 1fr auto; align-items:center; gap:8px;
    padding:4px 8px; border-radius:7px; font-size:12.5px}
  #logList li + li{margin-top:1px}
  #logList li:nth-child(odd){background:rgba(255,255,255,.018)}
  #logList .t{font-family:var(--mono); font-size:11px; color:var(--ink-faint); text-align:right}
  #logList .who{color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #logList .who .src{font-weight:600}
  #logList .dmg{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600}
  #logList li.mine .src{color:var(--mine-soft)} #logList li.mine .dmg{color:var(--mine)}
  #logList li.enemy .src{color:var(--enemy-soft)} #logList li.enemy .dmg{color:var(--enemy)}
  #logList li.crit .dmg{color:var(--gold)}
  #logList .star{color:var(--gold); font-weight:700}
  .log-empty{padding:18px 14px; color:var(--ink-faint); font-size:12px}
  /* buff/effect rows: a calmer, gold-accented sibling of the damage row so the
     eye still tracks damage as primary. Shots are never styled this way. */
  #logList li.buff{border-left:2px solid var(--support); font-size:12px}
  #logList li.buff .who{color:var(--ink-faint)}
  #logList li.buff .chan{font-family:var(--mono); font-size:10.5px; color:var(--ink-dim)}
  #logList li.buff.mine .src{color:var(--mine-soft)}
  #logList li.buff.enemy .src{color:var(--enemy-soft)}
  #logList li.buff .amt{font-family:var(--mono); font-size:11px; color:var(--support);
    font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right}

  /* ---- controls ---- */
  .controls{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--panel)}
  .transport{display:flex; gap:6px}
  .btn{
    font-family:var(--sans); font-size:14px; color:var(--ink); cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    width:38px; height:34px; display:grid; place-items:center; transition:background .12s,border-color .12s}
  .btn:hover{background:#232d3b; border-color:#33404f}
  .btn.play{width:46px; color:var(--mine)}
  .btn:focus-visible{outline:2px solid var(--mine); outline-offset:2px}
  .speeds{display:flex; gap:4px; margin-left:2px}
  .sp{font-family:var(--mono); font-size:11px; color:var(--ink-dim); cursor:pointer;
    background:transparent; border:1px solid var(--line); border-radius:7px; padding:5px 8px}
  .sp.active{color:var(--bg); background:var(--mine); border-color:var(--mine); font-weight:700}
  .sp:focus-visible{outline:2px solid var(--mine); outline-offset:2px}
  .scrub-wrap{flex:1; min-width:180px; display:flex; align-items:center}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:6px; cursor:pointer;
    background:linear-gradient(90deg,var(--mine) 0%,var(--mine) var(--pct,0%),#2a3542 var(--pct,0%),#2a3542 100%)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--ink); border:2px solid var(--mine); box-shadow:0 0 6px rgba(67,198,240,.6)}
  input[type=range]::-moz-range-thumb{width:14px; height:14px; border:2px solid var(--mine); border-radius:50%; background:var(--ink)}
  input[type=range]:focus-visible{outline:2px solid var(--mine); outline-offset:3px}
  .clock{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-dim); white-space:nowrap}
  .clock #tNow{color:var(--ink); font-weight:600}

  /* ---- header match clock (top-right) ---- */
  .hud-right{margin-left:auto; display:flex; align-items:center; gap:18px}
  .hud .legend{margin-left:0}
  .match-clock{
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:22px; font-weight:600; color:var(--ink); line-height:1;
    display:flex; align-items:baseline; gap:2px}
  .match-clock::before{content:"\23F1"; font-size:15px; color:var(--ink-faint); margin-right:6px; align-self:center}
  .match-clock .s{font-size:13px; color:var(--ink-faint); font-weight:400}
    /* match clock overlaid in the arena's top-right corner (moved out of the header) */
  .arena-clock{
    position:absolute; top:8px; right:10px; z-index:3; pointer-events:none;
    font-size:18px; padding:3px 9px; border-radius:9px;
    background:rgba(11,14,19,.55); border:1px solid var(--line-soft);
  }
  .arena-clock::before{font-size:13px; margin-right:5px}
  .arena-clock .s{font-size:11px}
  /* ---- stats panel (DEF + live damage tallies) ---- */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  @media (max-width:720px){ .stats{grid-template-columns:1fr} }
  .stats-col{border:1px solid var(--line); border-radius:12px; background:var(--panel); overflow:hidden}
  .stats-head{
    display:flex; align-items:center; gap:8px; padding:9px 14px;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim);
    border-bottom:1px solid var(--line-soft)}
  .stats-head .dot{width:9px; height:9px; border-radius:2px}
  .stats-head .dot.mine{background:var(--mine)} .stats-head .dot.enemy{background:var(--enemy)}
  .stats table{width:100%; border-collapse:collapse; font-size:12.5px}
  .stats th{
    font-weight:500; text-align:right; padding:6px 12px; color:var(--ink-faint);
    font-size:10px; letter-spacing:.07em; text-transform:uppercase; white-space:nowrap}
  .stats th.nm{text-align:left}
  .stats td{
    padding:6px 12px; border-top:1px solid var(--line-soft); text-align:right;
    font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink)}
  .stats td.nm{font-family:var(--sans); text-align:left; font-weight:600; white-space:nowrap}
  .stats tr[data-team=mine] td.nm{color:var(--mine-soft)}
  .stats tr[data-team=enemy] td.nm{color:var(--enemy-soft)}
  .stats tr.support td.nm{color:var(--support)}
  .stats td.def{color:var(--ink-dim)}
  .stats td.dealt{color:var(--ink); font-weight:600}
  .stats td.taken{color:var(--enemy-soft)}
  .stats .kindtag{font-size:9px; color:var(--ink-faint); font-family:var(--mono); margin-left:6px; text-transform:uppercase; letter-spacing:.06em}
    /* ATK + the five-group mitigation block (DR energy/phys, Misc, RES phys/energy).
     Boxed as one group and kept in a horizontal-scroll wrapper so the wide row
     scrolls instead of crushing. Values are static t=0 now; the timed layer will
     drive the same cells off the playhead. */
  .stats .stats-scroll{overflow-x:auto}
  .stats-scroll table{width:100%}
  .stats td.atk{color:var(--ink-dim); transition:color .12s}
  /* a live timed attack buff: the ATK cell goes gold and gains a small up-arrow */
  .stats td.atk.boosted{color:var(--gold); font-weight:600}
  .stats td.atk.boosted::after{content:" \25B2"; font-size:9px}
  .stats td.def.boosted{color:var(--gold); font-weight:600}
  .stats td.def.boosted::after{content:" \25B2"; font-size:9px}
  .stats .mit{font-size:11px; color:var(--ink-dim); background:rgba(255,255,255,.025); white-space:nowrap; transition:color .12s}
  /* a mitigation group moved by a live timed buff/debuff: gold, same cue as ATK */
  .stats td.mit.changed{color:var(--gold); font-weight:600}
  .stats th.mit{color:var(--ink-faint)}
  .stats td.res{color:var(--ink)}
  .stats .mledge{border-left:1px solid var(--line)}
  .stats .mredge{border-right:1px solid var(--line)}

  /* ---- analytics (studies below the replay) ---- */
  .analytics{display:flex; flex-direction:column; gap:16px}
  .ana-master{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim);
    padding-top:10px; border-top:1px solid var(--line-soft)}
  .ana-card{border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:14px 16px}
  .ana-card.tight{max-width:640px}
  .ana-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .ana-title{font-size:14px; font-weight:600; color:var(--ink)}
  .ana-sub{font-size:11.5px; color:var(--ink-faint); margin-top:2px}
  .ana-ctrls{display:flex; gap:8px; flex-wrap:wrap}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{font-family:var(--sans); font-size:11px; color:var(--ink-dim); background:transparent;
    border:0; padding:5px 10px; cursor:pointer}
  .seg button + button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--panel-2); color:var(--ink)}
  .seg button:focus-visible{outline:2px solid var(--mine); outline-offset:-2px}
  .ana-pills{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 2px}
  .ana-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-dim);
    background:var(--panel-2); border:1px solid var(--line); border-radius:20px; padding:3px 10px; cursor:pointer}
  .ana-pill i{width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 auto}
  .ana-pill.off{opacity:.42; text-decoration:line-through}
  .ana-plot{margin-top:10px; overflow-x:auto; cursor:crosshair}
  .ana-svg{display:block; width:100%; height:auto}
  .ana-legend{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--ink-dim); margin-top:8px}
  .ana-legend span{display:inline-flex; align-items:center; gap:6px}
  .ana-legend i{width:9px; height:9px; border-radius:2px; display:inline-block}
  .ana-lane{font-family:var(--sans); font-size:11px}
  .ana-peak{font-family:var(--mono); font-size:10px}
  .ana-row{font-family:var(--sans); font-size:11px; fill:var(--ink-dim)}
  .ana-val{font-family:var(--mono); font-size:10px; fill:var(--ink-dim)}
  .ana-tick{font-family:var(--mono); font-size:9.5px; fill:var(--ink-faint)}
  .ana-grid{stroke:var(--line-soft); stroke-width:1}
  .ana-axis{stroke:var(--line); stroke-width:1}
  .ana-ph{stroke:var(--gold); stroke-width:1.3; stroke-dasharray:3 3; pointer-events:none}
</style>

<div class="app">
  <header class="hud">
    <h1>Battle Autopsy Report</h1>
    <span class="sub" id="metaLine">—</span>
    <div class="hud-right">
        <span class="legend">
        <span><span class="swatch mine"></span><b>You</b></span>
        <span><span class="swatch enemy"></span><b>Enemy</b></span>
        <span><span class="swatch crit"></span><b>Crit</b></span>
      </span>
    </div>
  </header>

  <div class="stage">
      <div class="arena" id="arena">

const MINE = "#43c6f0", ENEMY = "#ff5d5d", GOLD = "#ffd166";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- formation layout (fractions of the arena box) ----------
function buildLayout(units){
  const groups = {mine:{front:[],back:[],support:[]}, enemy:{front:[],back:[],support:[]}};
  for(const u of units){
    // Overlord carries a late slot id (13/14) but deploys on the front line,
    // standing left of the front-row heroes; drones sit in the support band.
    const row = u.kind === "overlord" ? "front" : (u.kind === "hero" ? u.row : "support");
    (groups[u.team] || groups.mine)[row].push(u);
  }
  const bands = {
    enemy: {support:0.085, back:0.215, front:0.35},
    mine:  {front:0.65,  back:0.785, support:0.915},
  };
  const pos = {};
  for(const team of ["mine","enemy"]){
    for(const row of ["front","back","support"]){
      // overlord first (leftmost), then heroes by slot
      const arr = groups[team][row].sort((a,b)=>
        (a.kind==="overlord"?-1:0) - (b.kind==="overlord"?-1:0) || a.slot - b.slot);
      arr.forEach((u,i)=>{ pos[u.slot] = {x:(i+1)/(arr.length+1), y:bands[team][row]}; });
    }
  }
  return pos;
}

const pos = buildLayout(BATTLE.units);
const nameBySlot = {}, unitEl = {}, shieldEl = {}, mitEl = {}, dotEl = {}, hpEl = {};
const MIT_STACK_CAP = 3;   // pips per unit; mirrors replay.MIT_STACK_CAP
// DoT badge glyphs, keyed by replay DOT_TYPES.key. Emoji read at a glance; if a
// platform lacks one it falls back to the coloured pill + count, still legible.
const DOT_ICON = {burn:"🔥", radiation:"☢", inductive:"⚡"};
// Crowd-control marks (replay unit.controls). Each renders on the canvas as an icon
// + a depleting timer ring above the victim; the two keys get distinct colour, glyph
// and animation so overwhelm (auto-attacks blocked) and stun (fully disabled) never
// look alike. Mirrors replay.CONTROL_EFFECTS keys.
const CC_STYLE = {
  stun:      {color:"#b79bff", glyph:"✷"},   // violet, spinning stars
  overwhelm: {color:"#ff8a4d", glyph:"⊘"},   // orange, pulsing "no-act" mark
};
for(const u of BATTLE.units) nameBySlot[u.slot] = u.name;

// ---------- render units ----------
const arena = document.getElementById("arena");
for(const u of BATTLE.units){
  const p = pos[u.slot]; if(!p) continue;
  const el = document.createElement("div");
  el.className = `unit ${u.team} ${u.kind}`;
  el.style.left = (p.x*100)+"%";
  el.style.top  = (p.y*100)+"%";
  const tag = u.kind === "hero" ? u.row : u.kind;
  el.innerHTML = `<span class="nm">${u.name}</span><span class="tag">${tag}</span><span class="slot">${u.slot}</span>`;
  arena.appendChild(el);
  unitEl[u.slot] = el;
  // HP bar, for any unit with a known max HP. Rendered once + marked .has-hp; the
  // fill width and colour are driven per playhead frame by updateHp. Full-HP units
  // still show a full green bar (they simply never took damage).
  if(u.hpMax > 0){
    const hb = document.createElement("div");
    hb.className = "hpbar";
    hb.innerHTML = `<span class="hpfill"></span>`;
    const num = document.createElement("span");
    num.className = "hpnum";
    el.appendChild(hb);
    el.appendChild(num);
    el.classList.add("has-hp");
    hpEl[u.slot] = {fill: hb.querySelector(".hpfill"), num};
  }
  // Overhealth shield bar, only for units that ever hold shield (Lucius / chip).
  if(u.shieldMax > 0){
    const sh = document.createElement("div");
    sh.className = "shield";
    sh.innerHTML = `<span class="lbl"></span><span class="bar"><span class="fill"></span></span>`;
    el.appendChild(sh);
    shieldEl[u.slot] = {fill: sh.querySelector(".fill"), lbl: sh.querySelector(".lbl")};
  }
  // Mitigation-stack pips (violet, below the card), only for units that ever hold a
  // stack. Three slots always rendered so the cap reads at a glance; N filled live.
  if(u.mitStackMax > 0){
    const mp = document.createElement("div");
    mp.className = "mitpips";
    mp.title = "mitigation stacks — each blocks the next incoming auto-attack";
    mp.innerHTML = Array.from({length: MIT_STACK_CAP}, () => `<span class="pip"></span>`).join("");
    el.appendChild(mp);
    mitEl[u.slot] = mp.querySelectorAll(".pip");
  }
  // DoT-stack badges: one per DoT type this unit ever receives (replay.dotStacks,
  // already in a stable order). Rendered once; each badge's count + visibility is
  // driven per playhead frame by updateDotStacks.
  if(u.dotStacks && u.dotStacks.length){
    const dd = document.createElement("div");
    dd.className = "dots";
    dd.innerHTML = u.dotStacks.map(d =>
      `<span class="dotbadge ${d.key}" data-key="${d.key}" title="${d.name} — max ${d.cap}">`+
      `<span class="ic">${DOT_ICON[d.key] || "●"}</span><span class="n">0</span></span>`).join("");
    el.appendChild(dd);
    dotEl[u.slot] = {};
    dd.querySelectorAll(".dotbadge").forEach(b =>
      dotEl[u.slot][b.dataset.key] = {el: b, n: b.querySelector(".n")});
  }
}

// ---------- canvas ----------
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
function sizeCanvas(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = arena.clientWidth; H = arena.clientHeight;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
new ResizeObserver(sizeCanvas).observe(arena);
sizeCanvas();

// ---------- data ----------
const shots = BATTLE.shots;           // damage, sorted by t
const buffs = BATTLE.buffs || [];     // effect applications, log-only (not drawn)
for(const s of shots) s.kind = "shot";
for(const b of buffs) b.kind = "buff";
// One stream the log walks; the canvas and stats read only the shot entries.
// At an equal timestamp a shot sorts before the buff it applied.
const timeline = shots.concat(buffs)
  .sort((a,b)=> a.t - b.t || (a.kind==="buff") - (b.kind==="buff"));
const maxT = Math.max(1, BATTLE.meta.durationMs);
document.getElementById("metaLine").textContent =
  `${BATTLE.meta.mode} · ${(maxT/1000).toFixed(2)}s · ${shots.length} hits`
  + (buffs.length ? ` · ${buffs.length} effects` : "") + ` · #${BATTLE.meta.battleId}`;
document.getElementById("tEnd").textContent = (maxT/1000).toFixed(2);

function fmt(v){
  const a = Math.abs(v);
  if(a >= 1e6) return (v/1e6).toFixed(2)+"M";
  if(a >= 1e3) return (v/1e3).toFixed(2)+"K";
  return String(Math.round(v));
}

// ---------- playback state ----------
let clock = 0, playing = false, speed = 1, cursor = 0, lastReal = null;
const active = [];                    // live tracers: {shot, born}
const TRAVEL = reduceMotion ? 1 : 210, HOLD = 720, LIFE = TRAVEL + HOLD;

const scrub = document.getElementById("scrub");
scrub.max = maxT;
const tNow = document.getElementById("tNow");
const tBig = document.getElementById("tBig");
const playBtn = document.getElementById("play");

function spawnShot(shot){
  active.push({shot, born:performance.now()});
  const el = unitEl[shot.tgt];
  if(el){
    const cls = shot.team === "mine" ? "hit-mine" : "hit-enemy";
    setTimeout(()=>{ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), 150); },
      reduceMotion ? 0 : TRAVEL);
  }
}
function spawnAtTime(t){ for(const e of timeline) if(e.kind === "shot" && e.t === t) spawnShot(e); }

// ---------- combat log ----------
const logList = document.getElementById("logList");
const logCount = document.getElementById("logCount");
let loggedTo = -1;                    // index in timeline already in the log
function shotRow(s){
  const li = document.createElement("li");
  li.className = s.team + (s.crit ? " crit" : "");
  li.innerHTML =
    `<span class="t">${(s.t/1000).toFixed(2)}</span>`+
    `<span class="who"><span class="src">${nameBySlot[s.src]??"?"}</span> → ${nameBySlot[s.tgt]??"?"}</span>`+
    `<span class="dmg">-${s.dmg.toLocaleString("en-US")}${s.crit?'<span class="star"> !</span>':''}</span>`;
  return li;
}
function buffRow(b){
  const li = document.createElement("li");
  li.className = "buff " + (b.team || "");
  const tgts = b.targets.map(x => (x.name ?? "?") + (x.stacks > 1 ? ` ×${x.stacks}` : "")).join(", ");
  const meta = [b.amount, b.window].filter(Boolean).join(" · ");
  li.innerHTML =
    `<span class="t">${(b.t/1000).toFixed(2)}</span>`+
    `<span class="who"><span class="src">${nameBySlot[b.src]??"?"}</span> `+
      `<span class="chan">${b.chan}</span> → ${tgts || "—"}</span>`+
    `<span class="amt">${meta}</span>`;
  return li;
}
function logRow(e){ return e.kind === "buff" ? buffRow(e) : shotRow(e); }
function appendLog(idx){
  if(loggedTo === -1) logList.innerHTML = "";
  logList.appendChild(logRow(timeline[idx]));
  while(logList.children.length > 80) logList.removeChild(logList.firstChild);
  loggedTo = idx;
  logList.scrollTop = logList.scrollHeight;
}
function rebuildLog(){
  logList.innerHTML = "";
  const from = Math.max(0, cursor - 80);
  for(let i=from; i<cursor; i++) logList.appendChild(logRow(timeline[i]));
  loggedTo = cursor - 1;
  if(cursor === 0) logList.innerHTML = '<li class="log-empty">Press play to run the battle.</li>';
  logCount.textContent = `${cursor} / ${timeline.length} events`;
  logList.scrollTop = logList.scrollHeight;
}

        const support = u.kind === "hero" ? "" : "support";
        // Tag non-heroes with their kind, unless the generic name already says it
        // (drones/overlords often decode to the bare name "drone"/"overlord").
        const kindTag = (u.kind !== "hero" && u.name.toLowerCase() !== u.kind)
          ? `<span class="kindtag">${u.kind}</span>` : "";
        const m = u.mit || {};           // {} -> every group reads "—" for this unit
        return `<tr data-team="${team}" data-slot="${u.slot}" class="${support}">`+
          `<td class="nm">${u.name}${kindTag}</td>`+
          `<td class="atk">${num(u.atk)}</td>`+
          `<td class="def">${num(u.def)}</td>`+
          `<td class="mit mledge">${pct(m.dr_en)}</td>`+
          `<td class="mit">${pct(m.dr_ph)}</td>`+
          `<td class="mit">${pct(m.misc)}</td>`+
          `<td class="mit res">${pct(m.res_ph)}</td>`+
          `<td class="mit res mredge">${pct(m.res_en)}</td>`+
          `<td class="dealt">0</td><td class="taken">0</td></tr>`;
      }).join("");
    const emptyRow = '<tr><td class="nm">—</td>' + '<td></td>'.repeat(9) + '</tr>';
    col.innerHTML =
      `<div class="stats-head"><span class="dot ${team}"></span>${label}</div>`+
      `<div class="stats-scroll"><table><thead><tr>`+
        `<th class="nm">Hero</th>`+
        `<th title="Combat ATK: field reconstruction (deployment %, EW20 auras, lineup folded in); live value adds any timed +ATK% boost">Atk</th>`+
        `<th title="Combat DEF: field reconstruction (EW20 auras + lineup) + drone-chip DEF waves (75251) active at the playhead">Def</th>`+
        `<th class="mit mledge" title="DR group vs energy: 76050+76052, capped 75%">DR en</th>`+
        `<th class="mit" title="DR group vs physical: 76050+76051, capped 75%">DR ph</th>`+
        `<th class="mit" title="Misc / damage-taken reduction: 76150, capped 75%">Misc</th>`+
        `<th class="mit res" title="RES vs physical: 76057+76058, uncapped">RES ph</th>`+
        `<th class="mit res mredge" title="RES vs energy: 76057+76059, uncapped">RES en</th>`+
        `<th>Dmg Dealt</th><th>Dmg Taken</th>`+
      `</tr></thead>`+
      `<tbody>${rows || emptyRow}</tbody></table></div>`;
    host.appendChild(col);
    col.querySelectorAll("tr[data-slot]").forEach(tr => {
      statCells[tr.dataset.slot] = {
        dealt: tr.querySelector(".dealt"),
        taken: tr.querySelector(".taken"),
        atk: tr.querySelector(".atk"),
        def: tr.querySelector(".def"),
        mit: tr.querySelectorAll(".mit"),   // 5: dr_en, dr_ph, misc, res_ph, res_en
      };
    });
  }
})();

// ---- playhead-driven stats (stateless reads of the timed windows) ----
// Both fold "base + every window covering the clock". Half-open [start,end): a
// buff is off at the exact ms it ends. Overlapping windows just add.

// Live ATK: base × (1 + Σ active pct).
function atkAt(u){
  if(u.atk == null) return null;
  let pct = 0;
  for(const b of (u.atkBoosts || [])) if(clock >= b.start && clock < b.end) pct += b.pct;
  return pct ? Math.round(u.atk * (1 + pct)) : u.atk;
}
// Live DEF: combat DEF base + Σ(active drone-chip wave fractions) × the hero-DEF
// block those waves scale (defWaveTerm = 50017 + 50009*S_D). Same half-open
// [start,end): a wave is off at the exact ms it ends; overlapping waves add.
function defAt(u){
  if(u.def == null) return null;
  const term = u.defWaveTerm || 0;
  let w = 0;
  for(const b of (u.defWaves || [])) if(clock >= b.start && clock < b.end) w += b.val;
  return (w && term) ? Math.round(u.def + w * term) : u.def;
}
// Live mitigation groups: base t=0 channels + active window deltas, recombined
// with the model's caps (DR/misc cap 0.75, RES uncapped). Null for units with no
// mitigation channel (drones) so their cells stay "—". Mirrors Hero.mitigation_groups.
const MIT_KEYS = ["dr_en","dr_ph","misc","res_ph","res_en"];
// Raw group sums, UNCAPPED on purpose (user: show the full stacked value even past
// the game's 75% effective cap, so overcap headroom is visible). RES was always
// uncapped. NOTE the 0.75 cap still governs actual mitigation in combat -- this
// panel now shows the raw stack, not the effective number.
function mitGroups(ch){
  const a = id => ch[id] || 0;
  return {
    dr_en:  a(76050) + a(76052),
    dr_ph:  a(76050) + a(76051),
    misc:   a(76150),
    res_ph: a(76057) + a(76058),
    res_en: a(76057) + a(76059),
  };
}
function mitAt(u){
  if(!u.mit) return null;
  const eff = Object.assign({}, u.mitBase || {});
  for(const b of (u.mitBoosts || [])) if(clock >= b.start && clock < b.end)
    eff[b.attr] = (eff[b.attr] || 0) + b.val;
  return mitGroups(eff);
}

// The live-attr cells (ATK + the five mitigation groups) recompute EVERY frame,
// deliberately NOT cursor-gated: a window can END between two timeline events, so
// gating on cursor would freeze a stat at its boosted value past expiry. Cheap
// (a few units × a few windows); DOM writes are guarded so unchanged cells don't
// thrash layout. Gold = the value currently differs from its t=0 baseline.
function updateLiveAttrs(){
  for(const u of BATTLE.units){
    const c = statCells[u.slot]; if(!c) continue;
    const a = atkAt(u), boosted = a != null && u.atk != null && a > u.atk;
    const atext = a == null ? "—" : a.toLocaleString("en-US");
    if(c.atk.textContent !== atext) c.atk.textContent = atext;
    c.atk.classList.toggle("boosted", boosted);
    const el = unitEl[u.slot]; if(el) el.classList.toggle("boosted", boosted);
    // Live DEF: base combat DEF + active drone-chip waves. Gold when a wave lifts it.
    const d = defAt(u), dwaved = d != null && u.def != null && d > u.def;
    const dtext = d == null ? "—" : d.toLocaleString("en-US");
    if(c.def.textContent !== dtext) c.def.textContent = dtext;
    c.def.classList.toggle("boosted", dwaved);
    // Baseline for the gold "changed" cue = the UNCAPPED t=0 resting groups, so a
    // cell only lights up when a timed window actually moves it (not because the
    // uncapped base already sits above 0.75). Cached per unit.
    const m = mitAt(u), base = u._mit0 || (u._mit0 = mitGroups(u.mitBase || {}));
    if(m) MIT_KEYS.forEach((k,i) => {
      const cell = c.mit[i]; if(!cell) return;
      const text = (m[k] * 100).toFixed(1) + "%";
      if(cell.textContent !== text) cell.textContent = text;
      cell.classList.toggle("changed", base[k] != null && Math.abs(m[k] - base[k]) > 1e-6);
    });
  }
}

// Live shield-HP at the playhead, read from the precomputed step track (rem holds
// until the next keyframe). Like the ATK boost, NOT cursor-gated: a shield layer
// can expire between two timeline events, so this recomputes every clock change.
function shieldAt(u){
  const tr = u.shieldTrack; if(!tr || !tr.length) return 0;
  let rem = 0;
  for(const kf of tr){ if(kf.t <= clock) rem = kf.rem; else break; }
  return rem;
}
function updateShields(){
  for(const u of BATTLE.units){
    const s = shieldEl[u.slot]; if(!s) continue;
    const el = unitEl[u.slot];
    const rem = shieldAt(u);
    if(rem > 0){
      if(el) el.classList.add("has-shield");
      s.fill.style.width = Math.max(3, Math.min(100, rem / u.shieldMax * 100)) + "%";
      const txt = fmt(rem);
      if(s.lbl.textContent !== txt) s.lbl.textContent = txt;
    } else if(el){
      el.classList.remove("has-shield");
    }
  }
}

// Live HP at the playhead from the precomputed step track (hp holds until the next
// keyframe). Same stateless read as shieldAt/mitStackAt, scrub-safe both directions;
// a unit with no track (never damaged) reads full HP.
function hpAt(u){
  const tr = u.hpTrack; if(!tr || !tr.length) return u.hpMax;
  let hp = u.hpMax;
  for(const kf of tr){ if(kf.t <= clock) hp = kf.hp; else break; }
  return hp;
}
// Health colour: green healthy -> amber -> red critical, by fraction of max.
function hpColor(f){ return f > 0.5 ? "#5ad19a" : f > 0.25 ? "#e6c14e" : "#ff5d5d"; }
function updateHp(){
  for(const u of BATTLE.units){
    const h = hpEl[u.slot]; if(!h) continue;
    const hp = hpAt(u), f = Math.max(0, Math.min(1, hp / u.hpMax));
    h.fill.style.width = (f * 100) + "%";
    h.fill.style.background = hpColor(f);
    // Current HP only, comma-grouped (matches the damage numbers); max lives in the
    // stats panel, so the arena stays uncluttered.
    const txt = hp.toLocaleString("en-US");
    if(h.num.textContent !== txt) h.num.textContent = txt;
    // Dead = the HP sim's death keyframe is reached; greys the card (.dead). Stateless
    // — scrub back before death and the unit is alive again.
    const el = unitEl[u.slot];
    if(el) el.classList.toggle("dead", u.death != null && clock >= u.death);
  }
}

// Live mitigation-stack count at the playhead, read from the precomputed step track
// (n holds until the next keyframe). Same stateless read as shieldAt/atkAt, scrub-
// safe forward and back. No cursor gate: a stack can change between two timeline
// events (an incoming auto-attack is a shot, so it is one, but a grant + consume can
// straddle a frame), so this recomputes every clock change.
function mitStackAt(u){
  const tr = u.mitStacks; if(!tr || !tr.length) return 0;
  let n = 0;
  for(const kf of tr){ if(kf.t <= clock) n = kf.n; else break; }
  return n;
}
function updateMitStacks(){
  for(const u of BATTLE.units){
    const pips = mitEl[u.slot]; if(!pips) continue;
    const el = unitEl[u.slot];
    const n = mitStackAt(u);
    if(el) el.classList.toggle("has-mit", n > 0);
    for(let i=0; i<pips.length; i++) pips[i].classList.toggle("on", i < n);
  }
}

// Live DoT-stack counts at the playhead. stepAt reads a {t,n} step track the same
// half-open way as shieldAt/mitStackAt (last keyframe at/under the clock), so it is
// scrub-safe forward and back. Not cursor-gated: a stack expires BETWEEN timeline
// events, so the count recomputes every clock change, ticking up on an application
// and down as stacks expire.
function stepAt(track){
  let n = 0;
  for(const kf of track){ if(kf.t <= clock) n = kf.n; else break; }
  return n;
}
function updateDotStacks(){
  for(const u of BATTLE.units){
    const badges = dotEl[u.slot]; if(!badges) continue;
    for(const d of u.dotStacks){
      const b = badges[d.key]; if(!b) continue;
      const n = stepAt(d.track);
      b.el.classList.toggle("on", n > 0);
      if(n > 0){ const txt = String(n); if(b.n.textContent !== txt) b.n.textContent = txt; }
    }
  }
}

// Live crowd-control at the playhead: the CC window currently covering the clock,
// or null. Half-open [start,end) like every other read, so the mark clears at the
// exact ms it expires. When re-applications overlap, the latest-ending window wins
// (a fresh cast refreshes the timer). Scrub-safe forward and back; not cursor-gated
// so the ring keeps depleting between two timeline events.
function controlAt(u){
  const ws = u.controls; if(!ws || !ws.length) return null;
  let best = null;
  for(const w of ws) if(clock >= w.start && clock < w.end && (!best || w.end > best.end)) best = w;
  return best;
}
// The DOM cue only (dim + tinted card); the canvas ring is drawn in drawControls.
function updateControls(){
  for(const u of BATTLE.units){
    const el = unitEl[u.slot]; if(!el) continue;
    const w = controlAt(u);
    el.classList.toggle("cc-stun", !!w && w.key === "stun");
    el.classList.toggle("cc-overwhelm", !!w && w.key === "overwhelm");
  }
}

let statsCursor = -1;                 // last cursor the damage tallies were computed for
function updateStats(){
  if(cursor === statsCursor) return;  // dealt/taken only change when a shot crosses
  statsCursor = cursor;
  const dealt = {}, taken = {};
  for(let i=0; i<cursor; i++){
    const s = timeline[i];
    if(s.kind !== "shot") continue;   // buffs carry no damage
    dealt[s.src] = (dealt[s.src] || 0) + s.dmg;
    taken[s.tgt] = (taken[s.tgt] || 0) + s.dmg;
  }
  for(const slot in statCells){
    statCells[slot].dealt.textContent = (dealt[slot] || 0).toLocaleString("en-US");
    statCells[slot].taken.textContent = (taken[slot] || 0).toLocaleString("en-US");
  }
}

// ---------- clock control ----------
function countUpTo(t){ let i=0; while(i<timeline.length && timeline[i].t <= t) i++; return i; }
function setClock(v, {clear=true}={}){
  clock = Math.max(0, Math.min(maxT, v));
  cursor = countUpTo(clock);
  if(clear) active.length = 0;
  lastReal = null;
  rebuildLog();
  syncUI();
}
let anaTick = null;                   // analytics playhead updaters, wired once charts build
function syncUI(){
  scrub.value = clock;
  scrub.style.setProperty("--pct", (clock/maxT*100)+"%");
  tNow.textContent = (clock/1000).toFixed(2);
  tBig.textContent = (clock/1000).toFixed(2);
  logCount.textContent = `${cursor} / ${timeline.length} events`;
  playBtn.textContent = playing ? "⏸" : "▶";
  playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
  updateStats();
  updateLiveAttrs();
  updateShields();
  updateHp();
  updateMitStacks();
  updateDotStacks();
  updateControls();
  if(anaTick) anaTick();
}

// ---------- main loop ----------
function frame(now){
  if(playing){
    if(lastReal === null) lastReal = now;
    let next = clock + (now - lastReal) * speed;
    lastReal = now;
    if(next >= maxT){ next = maxT; playing = false; }
    while(cursor < timeline.length && timeline[cursor].t <= next){
      if(timeline[cursor].kind === "shot") spawnShot(timeline[cursor]);
      appendLog(cursor);
      cursor++;
    }
    clock = next;
    syncUI();
  } else {
    lastReal = null;
  }
  drawFx(now);
  requestAnimationFrame(frame);
}

function drawFx(now){
  ctx.clearRect(0,0,W,H);
  ctx.lineCap = "round";
  for(let i=active.length-1; i>=0; i--){
    const a = active[i], age = now - a.born;
    if(age > LIFE){ active.splice(i,1); continue; }
    const s = pos[a.shot.src], t = pos[a.shot.tgt];
    if(!s || !t){ active.splice(i,1); continue; }
    const sx=s.x*W, sy=s.y*H, tx=t.x*W, ty=t.y*H;
    const col = a.shot.team === "mine" ? MINE : ENEMY;

    if(age < TRAVEL){
      const p = age/TRAVEL;
      const cx = sx+(tx-sx)*p, cy = sy+(ty-sy)*p;
      const trail = 0.22;
      const bx = sx+(tx-sx)*Math.max(0,p-trail), by = sy+(ty-sy)*Math.max(0,p-trail);
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = col; ctx.lineWidth = a.shot.crit ? 3 : 2;
      ctx.shadowBlur = 8; ctx.shadowColor = col;
      ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(cx,cy); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(cx,cy, a.shot.crit?3.2:2.4, 0, 7); ctx.fill();
    } else {
      const p = (age-TRAVEL)/HOLD;               // 0..1 impact phase
      // impact ring
      ctx.globalAlpha = (1-p)*0.6;
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(tx,ty, 6+p*22, 0, 7); ctx.stroke();
      // rising damage number
      const crit = a.shot.crit;
      ctx.globalAlpha = Math.max(0, 1-p);
      ctx.font = `${crit?"700 ":"600 "}${crit?17:13}px ui-monospace,Consolas,monospace`;
      ctx.textAlign = "center";
      ctx.fillStyle = crit ? GOLD : col;
      ctx.shadowBlur = 6; ctx.shadowColor = "rgba(0,0,0,.9)";
      ctx.fillText(`-${fmt(a.shot.dmg)}${crit?"!":""}`, tx, ty - 10 - p*30);
      ctx.shadowBlur = 0;
    }
  }
  ctx.globalAlpha = 1;
  drawControls(now);
}

// Crowd-control overlay: for every unit currently disabled, an icon + a timer ring
// above its card that depletes to the window's scheduled end. Runs every RAF frame
// (like the tracers), so the ring animates smoothly while playing and holds a true
// remaining fraction while paused/scrubbed. `now` (performance.now) drives only the
// cosmetic spin/pulse; the ring fraction is battle-clock based.
function drawControls(now){
  for(const u of BATTLE.units){
    const w = controlAt(u); if(!w) continue;
    const p = pos[u.slot]; if(!p) continue;
    const frac = Math.max(0, Math.min(1, (w.end - clock) / (w.end - w.start)));
    drawCC(p.x*W, p.y*H - 34, frac, (w.end - clock)/1000, w.key, now);
  }
}
// One CC mark centred at (cx,cy): a dark disc, a faint full track, the remaining-time
// arc (from 12 o'clock, clockwise), the key's glyph + its own animation, and the
// remaining seconds beneath. Stun spins a ring of stars; overwhelm pulses its mark.
function drawCC(cx, cy, frac, remSec, key, now){
  const cfg = CC_STYLE[key] || CC_STYLE.stun, R = 11, TAU = Math.PI*2, top = -Math.PI/2;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha = .9; ctx.fillStyle = "rgba(11,14,19,.85)";
  ctx.beginPath(); ctx.arc(cx, cy, R+3, 0, TAU); ctx.fill();
  ctx.globalAlpha = .3; ctx.lineWidth = 3; ctx.strokeStyle = cfg.color;   // full track
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1; ctx.strokeStyle = cfg.color;                       // remaining
  ctx.shadowBlur = 7; ctx.shadowColor = cfg.color;
  ctx.beginPath(); ctx.arc(cx, cy, R, top, top + frac*TAU); ctx.stroke();
  ctx.shadowBlur = 0;

  if(key === "stun"){                                                     // spinning stars
    const spin = reduceMotion ? 0 : (now/650) % TAU;
    ctx.fillStyle = cfg.color;
    for(let i=0;i<3;i++){
      const a = spin + i*(TAU/3);
      ctx.globalAlpha = .55 + .45*Math.max(0, Math.cos(a));
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*(R-1.5), cy+Math.sin(a)*(R-1.5), 1.7, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.font = "700 12px system-ui,sans-serif";
    ctx.fillText(cfg.glyph, cx, cy+.5);
  } else {                                                                // pulsing mark
    const pulse = reduceMotion ? 0 : (Math.sin(now/230)+1)/2;
    ctx.globalAlpha = .6 + .4*pulse; ctx.fillStyle = cfg.color;
    ctx.font = `700 ${12+pulse*2}px system-ui,sans-serif`;
    ctx.fillText(cfg.glyph, cx, cy+.5);
  }

  ctx.globalAlpha = 1; ctx.fillStyle = cfg.color;                         // countdown
  ctx.font = "700 8.5px ui-monospace,Consolas,monospace"; ctx.textBaseline = "top";
  ctx.shadowBlur = 3; ctx.shadowColor = "rgba(0,0,0,.9)";
  ctx.fillText(remSec.toFixed(1)+"s", cx, cy+R+3);
  ctx.restore();
}

// ---------- controls ----------
playBtn.onclick = ()=>{
  if(clock >= maxT) setClock(0);
  playing = !playing; lastReal = null; syncUI();
};
document.getElementById("next").onclick = ()=>{
  playing = false;
  let i = cursor;                                // first event with t > clock
  while(i < timeline.length && timeline[i].t <= clock) i++;
  if(i >= timeline.length) return;
  setClock(timeline[i].t);
  spawnAtTime(timeline[i].t);
};
document.getElementById("prev").onclick = ()=>{
  playing = false;
  let i = cursor - 1;
  while(i >= 0 && timeline[i].t >= clock) i--;
  if(i < 0){ setClock(0); return; }
  setClock(timeline[i].t);
  spawnAtTime(timeline[i].t);
};
scrub.addEventListener("input", ()=>{ playing = false; setClock(+scrub.value); });

const speedWrap = document.getElementById("speeds");
[0.5,1,2,4].forEach(s=>{
  const b = document.createElement("button");
  b.className = "sp" + (s===1?" active":""); b.textContent = s+"×";
  b.onclick = ()=>{ speed = s; lastReal = null;
    speedWrap.querySelectorAll(".sp").forEach(x=>x.classList.toggle("active", x===b)); };
  speedWrap.appendChild(b);
});

// keyboard: space = play/pause, arrows = step
addEventListener("keydown", e=>{
  if(e.code === "Space"){ e.preventDefault(); playBtn.onclick(); }
  else if(e.code === "ArrowRight"){ e.preventDefault(); document.getElementById("next").onclick(); }
  else if(e.code === "ArrowLeft"){ e.preventDefault(); document.getElementById("prev").onclick(); }
});

// ===================== BATTLE ANALYTICS =====================
// Studies rendered below the replay from the same BATTLE.shots the arena fires.
// The two time charts and the raster share the replay clock: a gold playhead sweeps
// with playback and clicking a chart seeks. Drones excluded (heroes + overlord).
// Damage type for the "by type" split is unit.dtype (attacker-level; no per-hit type).
(function analytics(){
  const host = document.getElementById("analytics");
  if(!host || !shots.length) return;
  const PHYS = "#e6a552", ENERGY = "#9a8ef0", GREY = "#5f7285";
  const PALETTE = ["#43c6f0","#eb8f4b","#5ad19a","#e6c14e","#e07ba8","#6ea8ff","#b28be6","#7bd1c2"];
  const units = BATTLE.units.filter(u => u.kind !== "drone");
  const byTeam = {mine: units.filter(u=>u.team==="mine"), enemy: units.filter(u=>u.team==="enemy")};
  const color = {};
  byTeam.mine.forEach((u,i)=> color[u.slot] = PALETTE[i%PALETTE.length]);
  byTeam.enemy.forEach((u,i)=> color[u.slot] = PALETTE[i%PALETTE.length]);
  const teamColor = t => t === "mine" ? MINE : ENEMY;
  const nm = s => nameBySlot[s] ?? "?";
  const esc = v => String(v).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const dtype = {}; for(const u of BATTLE.units) dtype[u.slot] = u.dtype === "energy" ? "energy" : "physical";

  // ---- one aggregation pass over every shot ----
  const NB = Math.max(24, Math.min(150, Math.round(maxT/300))), binMs = maxT/NB;
  const dealt={}, dealtCrit={}, critN={}, taken={}, tType={}, tAtk={}, dealtB={}, recvB={};
  const add = (o,k,v)=> o[k] = (o[k]||0) + v;
  for(const s of shots){
    add(dealt, s.src, s.dmg);
    if(s.crit){ add(dealtCrit, s.src, s.dmg); add(critN, s.src, 1); }
    add(taken, s.tgt, s.dmg);
    (tType[s.tgt] || (tType[s.tgt] = {physical:0, energy:0}))[dtype[s.src]] += s.dmg;
    add(tAtk[s.tgt] || (tAtk[s.tgt] = {}), s.src, s.dmg);
    const bi = Math.min(NB-1, Math.floor(s.t/binMs));
    (dealtB[s.src] || (dealtB[s.src] = new Array(NB).fill(0)))[bi] += s.dmg;
    (recvB[s.tgt]  || (recvB[s.tgt]  = new Array(NB).fill(0)))[bi] += s.dmg;
  }
  const arrMax = a => a && a.length ? Math.max.apply(null, a) : 0;

  // playhead updaters, run on every clock change via syncUI -> anaTick
  const ticks = [];
  anaTick = () => { for(const f of ticks) f(); };
  const phX = (X0,PW) => X0 + (Math.max(0, Math.min(maxT, clock))/maxT)*PW;
  function seekFromClick(plot, X0, PW){
    plot.addEventListener("click", e => {
      const svg = plot.querySelector("svg"); if(!svg) return;
      const r = svg.getBoundingClientRect();
      const f = ((e.clientX - r.left)/r.width*1000 - X0)/PW;
      if(f >= -0.03 && f <= 1.03) setClock(Math.max(0, Math.min(maxT, f*maxT)));
    });
  }

  const head = document.createElement("div");
  head.className = "ana-master"; head.textContent = "Battle Analytics";
  host.appendChild(head);

  // ---------- time small-multiples (dealt / received) ----------
  function timeChart(cfg){
    const card = document.createElement("div"); card.className = "ana-card";
    card.innerHTML =
      `<div class="ana-top"><div><div class="ana-title">${cfg.title}</div>`+
        `<div class="ana-sub">${cfg.sub}</div></div>`+
        `<div class="ana-ctrls"><div class="seg team"></div>`+
        `<div class="seg scale"><button data-s="own" class="on">own scale</button>`+
        `<button data-s="shared">shared</button></div></div></div>`+
      `<div class="ana-pills"></div><div class="ana-plot"></div>`;
    host.appendChild(card);
    const segTeam = card.querySelector(".seg.team"), pillWrap = card.querySelector(".ana-pills"),
          plot = card.querySelector(".ana-plot");
    let team = byTeam.mine.length ? "mine" : "enemy", shared = false, phEl = null, geo = null;
    const hidden = new Set();

    for(const t of ["mine","enemy"]){
      if(!byTeam[t].length) continue;
      const b = document.createElement("button");
      b.textContent = t === "mine" ? "You" : "Enemy";
      if(t === team) b.classList.add("on");
      b.onclick = () => { team = t; hidden.clear();
        segTeam.querySelectorAll("button").forEach(x=>x.classList.toggle("on", x===b)); render(); };
      segTeam.appendChild(b);
    }
    card.querySelectorAll(".seg.scale button").forEach(b => b.onclick = () => {
      shared = b.dataset.s === "shared";
      card.querySelectorAll(".seg.scale button").forEach(x=>x.classList.toggle("on", x===b)); render(); });

    function render(){
      const us = byTeam[team];
      pillWrap.innerHTML = "";
      for(const u of us){
        const p = document.createElement("button");
        p.className = "ana-pill" + (hidden.has(u.slot) ? " off" : "");
        p.innerHTML = `<i style="background:${color[u.slot]}"></i>${esc(u.name)}`;
        p.onclick = () => { if(hidden.has(u.slot)) hidden.delete(u.slot);
          else if(us.length - hidden.size > 1) hidden.add(u.slot); render(); };
        pillWrap.appendChild(p);
      }
      const shown = us.filter(u => !hidden.has(u.slot));
      const X0=110, X1=902, PW=X1-X0, laneH=34, lineH=24, padTop=12,
            H = padTop + shown.length*laneH + 26, axisY = H-22;
      const gmax = shared ? Math.max(1, ...shown.map(u => arrMax(cfg.series[u.slot]))) : 0;
      let s = `<svg viewBox="0 0 1000 ${H}" class="ana-svg">`;
      s += `<line class="ana-ph" x1="${X0}" x2="${X0}" y1="${padTop-2}" y2="${axisY}"></line>`;
      shown.forEach((u,i) => {
        const laneTop = padTop + i*laneH, base = laneTop + 28,
              arr = cfg.series[u.slot] || new Array(NB).fill(0),
              mx = shared ? gmax : Math.max(1, arrMax(arr)), peak = arrMax(arr);
        s += `<line class="ana-grid" x1="${X0}" x2="${X1}" y1="${base}" y2="${base}"></line>`;
        let pts = "";
        for(let j=0;j<NB;j++){ const x = X0 + ((j+0.5)/NB)*PW, y = base - (arr[j]/mx)*lineH;
          pts += `${x.toFixed(1)},${y.toFixed(1)} `; }
        s += `<polyline fill="none" stroke="${color[u.slot]}" stroke-width="1.6" points="${pts.trim()}"></polyline>`;
        s += `<text class="ana-lane" x="6" y="${laneTop+17}" fill="${color[u.slot]}">${esc(u.name)}</text>`;
        s += `<text class="ana-peak" x="${X1+6}" y="${laneTop+17}" fill="${color[u.slot]}">${peak?("▲"+fmt(peak)):"—"}</text>`;
      });
      s += `<line class="ana-axis" x1="${X0}" x2="${X1}" y1="${axisY}" y2="${axisY}"></line>`;
      s += `<text class="ana-tick" x="${X0}" y="${axisY+14}">0s</text>`;
      s += `<text class="ana-tick" x="${(X0+X1)/2}" y="${axisY+14}" text-anchor="middle">${(maxT/2000).toFixed(0)}s</text>`;
      s += `<text class="ana-tick" x="${X1}" y="${axisY+14}" text-anchor="end">${(maxT/1000).toFixed(0)}s</text>`;
      s += `</svg>`;
      plot.innerHTML = s;
      phEl = plot.querySelector(".ana-ph"); geo = {X0, PW};
      position();
    }
    function position(){ if(phEl){ const x = phX(geo.X0, geo.PW).toFixed(1);
      phEl.setAttribute("x1", x); phEl.setAttribute("x2", x); } }
    seekFromClick(plot, 110, 792);
    ticks.push(position);
    render();
  }
  timeChart({title:"Damage dealt over time", series:dealtB,
    sub:"Every hero has their own lane, scaled to their own peak, so you can see exactly when each one spiked. Click a name to hide it, or click anywhere on the chart to jump to that moment."});
  timeChart({title:"Damage received over time", series:recvB,
    sub:"How much damage each hero was taking, moment to moment, on the same lanes and timeline."});

  // ---------- scoreboard (base + crit-hit damage) ----------
  (function scoreboard(){
    const us = units.slice().sort((a,b)=>(dealt[b.slot]||0)-(dealt[a.slot]||0));
    const mx = Math.max(1, ...us.map(u=>dealt[u.slot]||0));
    const X0=104, PW=280, rowH=23, H=us.length*rowH+16;
    let s = `<svg viewBox="0 0 520 ${H}" class="ana-svg">`;
    us.forEach((u,i)=>{
      const y=i*rowH+6, tot=dealt[u.slot]||0, cr=dealtCrit[u.slot]||0,
            wB=((tot-cr)/mx)*PW, wC=(cr/mx)*PW, wT=(tot/mx)*PW;
      s += `<text class="ana-row" x="6" y="${y+13}">${esc(u.name)}</text>`;
      s += `<rect x="${X0}" y="${y+2}" width="${wB.toFixed(1)}" height="14" rx="3" fill="${teamColor(u.team)}"></rect>`;
      if(wC>0.4) s += `<rect x="${(X0+wB).toFixed(1)}" y="${y+2}" width="${wC.toFixed(1)}" height="14" rx="3" fill="${GOLD}"></rect>`;
      s += `<text class="ana-val" x="${(X0+wT+6).toFixed(1)}" y="${y+13}">${fmt(tot)}${critN[u.slot]?` <tspan fill="${GOLD}">×${critN[u.slot]}</tspan>`:""}</text>`;
    });
    s += `</svg>`;
    const card = document.createElement("div"); card.className = "ana-card tight";
    card.innerHTML = `<div class="ana-title">Damage dealt scoreboard</div>`+
      `<div class="ana-sub">base + <b style="color:${GOLD};font-weight:600">crit-hit damage</b> · ×N crits landed</div>`+
      `<div class="ana-plot" style="cursor:default">${s}</div>`;
    host.appendChild(card);
  })();

  // ---------- damage taken (by type / by attacker toggle) ----------
  (function takenChart(){
    const us = byTeam.mine.slice().sort((a,b)=>(taken[b.slot]||0)-(taken[a.slot]||0));
    if(!us.length) return;
    const atkTotals = {};
    for(const u of us){ const m = tAtk[u.slot]||{}; for(const k in m) add(atkTotals, k, m[k]); }
    const topAtk = Object.keys(atkTotals).map(Number).sort((a,b)=>atkTotals[b]-atkTotals[a]).slice(0,4);
    const card = document.createElement("div"); card.className = "ana-card";
    card.innerHTML = `<div class="ana-top"><div class="ana-title">Damage taken</div>`+
      `<div class="seg tview"><button data-v="type" class="on">by type</button>`+
      `<button data-v="atk">by attacker</button></div></div>`+
      `<div class="ana-plot" style="cursor:default"></div><div class="ana-legend"></div>`;
    host.appendChild(card);
    const plot = card.querySelector(".ana-plot"), legend = card.querySelector(".ana-legend");
    let view = "type";
    card.querySelectorAll(".seg.tview button").forEach(b => b.onclick = () => {
      view = b.dataset.v;
      card.querySelectorAll(".seg.tview button").forEach(x=>x.classList.toggle("on", x===b)); draw(); });
    function draw(){
      const mx = Math.max(1, ...us.map(u=>taken[u.slot]||0));
      const X0=104, PW=360, rowH=26, H=us.length*rowH+12;
      let s = `<svg viewBox="0 0 560 ${H}" class="ana-svg">`;
      us.forEach((u,i)=>{
        const y=i*rowH+6; let x=X0;
        s += `<text class="ana-row" x="6" y="${y+14}">${esc(u.name)}</text>`;
        if(view === "type"){
          const tt = tType[u.slot] || {physical:0, energy:0};
          [["physical",PHYS],["energy",ENERGY]].forEach(([k,c])=>{ const w=(tt[k]/mx)*PW;
            if(w>0.3){ s+=`<rect x="${x.toFixed(1)}" y="${y+2}" width="${w.toFixed(1)}" height="16" rx="3" fill="${c}"></rect>`; x+=w; } });
        } else {
          const m = tAtk[u.slot] || {};
          topAtk.forEach(a=>{ const w=((m[a]||0)/mx)*PW;
            if(w>0.3){ s+=`<rect x="${x.toFixed(1)}" y="${y+2}" width="${w.toFixed(1)}" height="16" rx="3" fill="${color[a]||GREY}"></rect>`; x+=w; } });
          let other=0; for(const k in m) if(!topAtk.includes(Number(k))) other+=m[k];
          const w=(other/mx)*PW;
          if(w>0.3) s+=`<rect x="${x.toFixed(1)}" y="${y+2}" width="${w.toFixed(1)}" height="16" rx="3" fill="${GREY}"></rect>`;
        }
        s += `<text class="ana-val" x="${(X0+(taken[u.slot]||0)/mx*PW+6).toFixed(1)}" y="${y+14}">${fmt(taken[u.slot]||0)}</text>`;
      });
      s += `</svg>`; plot.innerHTML = s;
      legend.innerHTML = view === "type"
        ? `<span><i style="background:${PHYS}"></i>physical</span><span><i style="background:${ENERGY}"></i>energy</span>`
        : topAtk.map(a=>`<span><i style="background:${color[a]||GREY}"></i>${esc(nm(a))}</span>`).join("")
          + `<span><i style="background:${GREY}"></i>others</span>`;
    }
    draw();
  })();

  // ---------- attack rhythm raster ----------
  (function raster(){
    const order = [...byTeam.mine, ...byTeam.enemy];
    const X0=100, X1=956, PW=X1-X0, rowH=24, padTop=10, H=padTop+order.length*rowH+22, axisY=H-14;
    const maxD = Math.max.apply(null, shots.map(s=>s.dmg).concat(1));
    let s = `<svg viewBox="0 0 1000 ${H}" class="ana-svg">`;
    s += `<line class="ana-ph" x1="${X0}" x2="${X0}" y1="${padTop}" y2="${axisY}"></line>`;
    order.forEach((u,i)=>{
      const y = padTop + i*rowH + 13;
      s += `<text class="ana-lane" x="6" y="${y+4}" fill="${color[u.slot]}">${esc(u.name)}</text>`;
      for(const sh of shots){ if(sh.src !== u.slot) continue;
        const x = X0 + (sh.t/maxT)*PW, r = 2 + (sh.dmg/maxD)*4.5;
        s += `<circle cx="${x.toFixed(1)}" cy="${y}" r="${r.toFixed(1)}" fill="${color[u.slot]}" fill-opacity="0.85"${sh.crit?` stroke="${GOLD}" stroke-width="1"`:""}></circle>`;
      }
    });
    if(byTeam.mine.length && byTeam.enemy.length){
      const dy = padTop + byTeam.mine.length*rowH + 1;
      s += `<line class="ana-grid" x1="0" x2="1000" y1="${dy}" y2="${dy}"></line>`;
    }
    s += `<line class="ana-axis" x1="${X0}" x2="${X1}" y1="${axisY}" y2="${axisY}"></line>`;
    s += `<text class="ana-tick" x="${X0}" y="${axisY+13}">0s</text>`;
    s += `<text class="ana-tick" x="${X1}" y="${axisY+13}" text-anchor="end">${(maxT/1000).toFixed(0)}s</text>`;
    s += `</svg>`;
    const card = document.createElement("div"); card.className = "ana-card";
    card.innerHTML = `<div class="ana-title">Attack rhythm</div>`+
      `<div class="ana-sub">each dot a hit · size = damage · gold ring = crit · click to seek</div>`+
      `<div class="ana-plot">${s}</div>`;
    host.appendChild(card);
    const plot = card.querySelector(".ana-plot"), ph = plot.querySelector(".ana-ph");
    ticks.push(()=>{ const x = phX(X0,PW).toFixed(1); ph.setAttribute("x1",x); ph.setAttribute("x2",x); });
    seekFromClick(plot, X0, PW);
  })();
})();

setClock(0);
requestAnimationFrame(frame);
</script>
